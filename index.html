<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Intellektual Salomatlik Platformasi — Farg'ona vodiysi uchun kardiologik xavf prognozlash, skrining va salomatlik monitoring tizimi."
    />
    <meta name="theme-color" content="#eef2f8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Intellektual Salomatlik Platformasi</title>
    <script>
      (function () {
        var t = localStorage.getItem('soglik_theme');
        var theme = t === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
